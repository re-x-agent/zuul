---
features:
  - |
    The GitHub driver can now read a topic from pull request labels:
    the name of a label is the topic.  Queues which set
    :attr:`queue.dependencies-by-topic` treat open pull requests that
    carry the same label as circular dependencies.  Labels are matched
    by their whole name, ignoring case; pull requests sharing at least
    one label are in the same topic.  Adding or removing a label
    re-evaluates pull requests of that topic which are already
    queued.  Queues which do not set the option are unchanged.
